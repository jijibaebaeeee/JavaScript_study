<!-- 목표
button을 누르면 팝업창이 열리는 함수를 작성하고 적용하세요 -->
<!-- 1번 : 팝업창 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button onclick="modalOpen()">팝업열기</button>
</body>
<script>
  function modalOpen(){ 
    window.open("https:///www.naver.com", "_blank", "width = 1000px height = 1000px");
  }
</script>
</html>
<!-- 결과
내가 원하는 창을 열어줄 수 있겠다.-->
