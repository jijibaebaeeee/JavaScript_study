<!-- 5번 : 비동기 스크립트(async 스크립트)-->
 <!-- 이해하고 넘어가기-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비동기 스크립트(async 스크립트)</title>
</head>
<body>
  <p>스크립트 앞 컨텐츠</p>  <!--2번-->
  <script>
    document.addEventListener("DOMContentLoaded", () => { // 1번
      alert("DOM이 준비되었습니다.");
    })
  </script>
  <script async src="https://javascript.info/article/script-async-defer/long.js"></script> <!--4번-->
  <script async src="https://javascript.info/article/script-async-defer/small.js"></script> <!--5번-->
  <p>스크립트 뒤 콘텐츠</p> <!--2번-->

  <!-- 이거는 화면을 먼저 보여주지 않음.. 확인을 눌러야 화면이 보임-->
  <!-- 비동기 스크립트 실행순서 : 서로 독립적이며 다운로드가 먼저 완료된 스크립트가 먼저 실행된다
    small.js가 long.js보다 먼저 다운로드 되면 small.js가 먼저 실행된다
    이런 실행 순서를 load-first-order라고 부른다.
    defer 속성 : 외부 스크립트 파일에만 적용
    async 속성 : 외부 스크립트 파일에만 유효-->
</body>
</html>
<!--결과
화면을 먼저 보여주지 않고 이벤트가 먼저 실행된다음에 p태그들이 보이고 async가 보인다.-->
