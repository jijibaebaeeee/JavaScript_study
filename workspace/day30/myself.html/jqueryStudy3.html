<!-- js와 jquery를 사용하여 버튼 이벤트 설정해보기-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- div>div>input:text.number -->
  <div>
    <div><input type="text" name="number" value="1" class="number"></div>
    <div><input type="text" name="number" value="2" class="number"></div>
    <div><input type="text" name="number" value="3" class="number"></div>
    <div>
      <button onclick="jsChange()">js변경</button> <!--클릭시 변경되게 속성으로 이벤트 설정-->
      <button onclick="jqueryChange()">jquery변경</button>
    </div>
  </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
<script>
  function jsChange(){
    document.querySelectorAll('.number').forEach((element) => {
      element.style.borderColor = "red";
    })
  }

  function jqueryChange(){
    $(`.number`).css("border-color", "blue");
  }

</script>
</html>
<!-- 목표
button을 클릭시 
1. js변경의 경우
   input태그의 테두리 색을 red로 변경

2. jquery의 경우
   input 태그의 테두리 색을 blue로 변경  -->
   
<!-- 결론
js를 사용할 경우 (모든 요소에 적용 하고싶으면 반복문 필요)
  (1). HTMLCollection의 경우 인덱스로 접근해서 스타일을 지정해줘야한다.
  (2)  NodeList의 경우 요소 자체로 접근해서 스타일을 지정해줘야한다.

jquery를 사용할 경우(반복문 없이 모든 요소에 적용 가능)
  (1). jquery 객체에서 .css를 이용해서 바로 적용한다. -->
