<!--4번 : 다양한 jquery 메소드 사용하기-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <ul class="car">
    <li>페라리</li>
    <li>롤스로이스</li>
    <li>벤틀리</li>
  </ul>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
<script>
  let $ul = $(`ul`);
  let $li = $(`li`);
  
  //1
  console.log($li);
  //2
  console.log($li.eq(0));
  //3
  console.log($li.first());
  console.log($($li[0])); // 인덱스 접근 -> 요소 -> $(요소) -> jqeury 객체
  //4
  console.log($li.eq(2).text());
  //5
  console.log($li.eq(0).next().text("람보르기니"));
  //6
  console.log($li.eq(1).prev().text());
  //7 ★
  console.log($ul.eq(1).closest("ul").attr("class", "super-car"));
  //8
  console.log($ul.children().first().text());
  //9
  $ul.find('li').first().remove();
  //10 ★
  $ul.append("<li>벤츠</li>");
  console.log($ul);
  //11 ★
  $ul.html("<li>람보르기니</li>");
</script>
</html>
<!-- 목표
리스트에 접근하여
1. li 출력
2. 첫번째 요소 jquery 객체로 출력
3. (2)번 다른 방법으로 출력
4. 벤틀리 출력
5. 페라리에 접근하여 롤스로이스를 람보르기니로 수정
6. 람보릐니로 접근하여 페라리 출력
7. ul 속성의 class를 super-car로 변경
8. ul 태그의 자식 중에서 벤틀리 가져오기
9. ul 태그 자식 중에서 첫번째 자식 요소 삭제
10. ul 태그의 마지막 자식요소로 벤츠 추가
11. ul ㅐ그의 기존 li 모두 없애고 람보르기니만 남기기 -->
